{% load static %}

<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>
        {% block title %}
        TECHNO BABZ | Professional DJ & Event Services
        {% endblock %}
    </title>

    <!-- Font Awesome -->
    <link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
    >

    <!-- Bootstrap CSS -->
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <!-- Bootstrap Icons -->
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css"
        rel="stylesheet"
    >

    <!-- Custom CSS -->
    <link
        rel="stylesheet"
        href="{% static 'css/style.css' %}"
    >
</head>


<body class="{% block body_class %}{% endblock %}">

    

   <!-- ================= NAVBAR ================= -->

<header class="tb-navbar">

    <div class="tb-nav">

        <!-- LOGO -->
        <a href="{% url 'home' %}" class="tb-logo">

            <div class="tb-logo-circle">
                TB
            </div>

            <div>
                <h2>
                    TECHNO <span>BABZ</span>
                </h2>

                <small>
                    Professional DJ &amp; Event Services
                </small>
            </div>

        </a>


        <!-- NAVIGATION -->
        <nav class="tb-menu">

            <a href="{% url 'home' %}"
               class="{% if request.resolver_match.url_name == 'home' %}active{% endif %}">
                Home
            </a>

            <a href="{% url 'about' %}"
               class="{% if request.resolver_match.url_name == 'about' %}active{% endif %}">
                About
            </a>

            <a href="{% url 'events' %}"
               class="{% if request.resolver_match.url_name == 'events' %}active{% endif %}">
                Events
            </a>

            <a href="{% url 'contact' %}"
               class="{% if request.resolver_match.url_name == 'contact' %}active{% endif %}">
                Contact
            </a>

        </nav>


        <!-- BOOK NOW -->
     <a class="tb-book" href="{% url 'booking' %}">
    <i class="fa-regular fa-calendar-check"></i>
    Book Now
</a>


        <!-- MOBILE BUTTON -->
        <button
            class="tb-mobile-btn"
            id="tbMobileBtn"
            type="button"
        >
            <i class="fa-solid fa-bars"></i>
        </button>

    </div>

</header>

    <!-- ================= MAIN CONTENT ================= -->

    <main class="site-main">

        {% block content %}
        {% endblock %}

    </main>


    <!-- ================= FOOTER ================= -->

    <footer class="site-footer">

        <div class="footer-content">

            © 2026
            <span>TECHNO BABZ</span>.
            All Rights Reserved.

        </div>

    </footer>


    <!-- ================= BOOTSTRAP JS ================= -->

    <script
        src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/js/bootstrap.bundle.min.js">
    </script>


    {% block extra_js %}
    {% endblock %}

</body>

</html>
